<!--creating a base file for the navbar which is consistent on all pages-->

{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Home Decor{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>

    <body class="store-page">
        <nav class="navbar">
            <div class="nav-brand">
                <!--logo goes here: <img src="{# static 'images/logo.png' #}" alt="Logo"> -->
                <span class="brand-name">Aurora Decor</span>
            </div>

            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Log Out</button>
            </form>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
