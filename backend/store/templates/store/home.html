{% extends 'store/base.html' %} <!-- start from base.html -->
{% block title %}Home{% endblock %}
{% block content %}
    <section class="hero">
        <h1>Aurora Decor</h1>
        <p class="tagline">Curated Home Decor & Furnishings</p>

        <form method="GET" action="#" class="search-form">
            <input type="text" name="q" placeholder="Search for home decor..." class="search-input">
            <button type="submit" class="search-btn">🔍︎</button>
        </form>
    </section>

    <section class="spotlight">
        <h2>⋆⊱༻ Spotlight ༺⊰⋆</h2>
        <div class="spotlight-grid">
            <!-- using a for loop to display the spotlight cards -->
            {% for product in featured %}
                {% include 'store/_product_card.html' %}
            {% endfor %}
        </div>
    </section>
{% endblock %}
